# The TrackLap server on Cloudflare Workers (see server/README.md). Deployed by Cloudflare's Git
# integration from this folder; the domain tracklap.tbsgaming.win is set on the Worker in the dashboard.
name = "tracklap"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true
preview_urls = false

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "BOARDS"
class_name = "Boards"

[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "Accounts"

[[durable_objects.bindings]]
name = "GARAGES"
class_name = "Garage"

# SQLite-backed objects, the kind the Workers free plan has.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Boards"]

# 0.8.0: accounts and garages. ADMIN_KEY, a secret set in the dashboard, is the moderator's key.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["Accounts", "Garage"]

# Push notifications (src/push.js). These two only say which Apple key and team: the key itself,
# APNS_KEY, and Firebase's FCM_SERVICE_ACCOUNT are secrets set in the dashboard.
[vars]
APNS_KEY_ID = "D72YXX7K3Y"
APNS_TEAM_ID = "4RPJ56QNT3"

[observability]
enabled = true
