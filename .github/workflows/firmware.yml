# ESP32 firmware for every chip with Bluetooth LE, built with arduino-cli. Each chip gets one
# merged .bin to flash at address 0x0 (ESP Web Tool or esptool), in the tracklap-firmware artifact.
name: ESP32 firmware

on:
  push:
    paths: ['firmware/**', '.github/workflows/firmware.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ESP32_INDEX: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: ESP32 core and NimBLE
        run: |
          arduino-cli core update-index --additional-urls "$ESP32_INDEX"
          arduino-cli core install esp32:esp32 --additional-urls "$ESP32_INDEX"
          arduino-cli lib install NimBLE-Arduino
          arduino-cli core list
          arduino-cli lib list

      # The native-USB chips print to their USB port, which is the one used to flash them.
      - name: Build every chip
        run: |
          set -u
          VER=$(sed -n 's/^#define FW_VERSION "\(.*\)"/\1/p' firmware/TrackLap/TrackLap.ino)
          mkdir -p out
          failed=""
          for target in \
            esp32=esp32:esp32:esp32 \
            esp32s3=esp32:esp32:esp32s3:CDCOnBoot=cdc \
            esp32c3=esp32:esp32:esp32c3:CDCOnBoot=cdc \
            esp32c5=esp32:esp32:esp32c5:CDCOnBoot=cdc \
            esp32c6=esp32:esp32:esp32c6:CDCOnBoot=cdc \
            esp32h2=esp32:esp32:esp32h2:CDCOnBoot=cdc; do
            chip=${target%%=*}
            fqbn=${target#*=}
            echo "::group::$chip ($fqbn)"
            if arduino-cli compile --fqbn "$fqbn" --build-path "build/$chip" --warnings default firmware/TrackLap; then
              cp "build/$chip/TrackLap.ino.merged.bin" "out/TrackLap-fw-$VER-$chip.bin" || failed="$failed $chip"
            else
              failed="$failed $chip"
            fi
            echo "::endgroup::"
          done
          ls -la out
          if [ -n "$failed" ]; then echo "::error::Failed:$failed"; exit 1; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tracklap-firmware
          path: out/*.bin
          retention-days: 30
