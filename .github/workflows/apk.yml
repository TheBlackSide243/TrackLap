name: Android APK

# The Android app (android/), built on every push that touches it: TrackLap and TrackLap Lite (the
# full and lite flavors). Signed with the release key when the ANDROID_KEYSTORE and
# ANDROID_KEYSTORE_PASSWORD secrets are set, else with a debug key.
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'tools/l10n.mjs'
      - 'project.yml'
      - '.github/workflows/apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/tracklap.p12"
            echo "TRACKLAP_KEYSTORE=$RUNNER_TEMP/tracklap.p12" >> "$GITHUB_ENV"
          else
            echo "No release key: signed with a debug key."
          fi
      - name: Build
        working-directory: android
        env:
          TRACKLAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Name the APKs
        run: |
          v=$(grep -m1 'MARKETING_VERSION' project.yml | sed 's/.*"\(.*\)".*/\1/')
          mkdir -p out
          cp android/app/build/outputs/apk/full/release/app-full-release.apk "out/TrackLap-$v.apk"
          cp android/app/build/outputs/apk/lite/release/app-lite-release.apk "out/TrackLap-Lite-$v.apk"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: tracklap-apk
          path: out/*.apk
