name: TrackLap
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: "0.10.0"
    CURRENT_PROJECT_VERSION: "17"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  TrackLap:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.tracklap
        PRODUCT_NAME: TrackLap
        INFOPLIST_FILE: Support/Info.plist
        # Push notifications; the TestFlight workflow signs the archive with it, the Feather build has none.
        CODE_SIGN_ENTITLEMENTS: Support/TrackLap.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme: {}
  # The free app: Live, Drag, Tracks, Sessions and Device, all on the phone. No account, no friends,
  # no leaderboards, no garage: the same sources built with LITE (see Edition.swift).
  TrackLapLite:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.tracklap.lite
        PRODUCT_NAME: TrackLapLite
        INFOPLIST_FILE: Support/Info-Lite.plist
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) LITE"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme: {}
