name: TrackLap
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: "0.9.1"
    CURRENT_PROJECT_VERSION: "15"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  TrackLap:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.tracklap
        PRODUCT_NAME: TrackLap
        INFOPLIST_FILE: Support/Info.plist
        # Push notifications; the TestFlight workflow signs the archive with it, the Feather build has none.
        CODE_SIGN_ENTITLEMENTS: Support/TrackLap.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme: {}
